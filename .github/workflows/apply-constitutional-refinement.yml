name: Apply constitutional refinement

on:
  push:
    branches:
      - research/epistemic-artefacts-constitutional-attention

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/epistemic-artefacts-constitutional-attention
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply research and intake refinements
        run: |
          python <<'PY'
          import json, re
          from pathlib import Path

          def dump_compact_string_arrays(path, data):
              text = json.dumps(data, indent=2, ensure_ascii=False)
              pattern = re.compile(r'\[\n((?:\s+"(?:[^"\\]|\\.)*"(?:,\n|\n))+?)\s*\]')
              def repl(match):
                  values = [line.strip().rstrip(',') for line in match.group(1).splitlines() if line.strip()]
                  return '[' + ', '.join(values) + ']'
              Path(path).write_text(pattern.sub(repl, text) + '\n')

          portfolio_path = Path('src/data/possibilityPortfolio.json')
          portfolio = json.loads(portfolio_path.read_text())
          constitutional = next(x for x in portfolio['possibilities'] if x['id'] == 'possibility:constitutional-attention-search')
          constitutional.update({
              'title': 'Constitutional attention as adversarial co-evolutionary search',
              'summary': 'Explore a governance/search architecture in which candidate strategies for scarcity displacement co-evolve against adversarial tests, counterexamples and failure scenarios under a human-governed constitution of plural worthwhile-future objectives, hard constraints, escalation rules and retained historical failures.',
              'lineage_status': 'competitive coevolution + interactive evolutionary computation + constitutional/selective oversight + autonomous discovery antecedents; synthesis novelty unassessed',
              'lineage_sources': [
                  'Rosin & Belew 1997 / competitive coevolution and hall-of-fame archives',
                  'competitive coevolution / adversarial optimization literature',
                  'interactive evolutionary computation',
                  'Constitutional AI / principle-guided scalable oversight',
                  'meaningful/selective human oversight',
                  'safe and multi-objective optimization not yet deeply reviewed'
              ],
              'worthwhile_future': 'Much larger safe search and realization capacity in which proposed paths to worthwhile futures must survive active attempts to expose harms, externalities, brittleness, exclusion and reward hacking without requiring item-level human attention to scale linearly with machine cognition.',
              'capacity_created': ['search leverage', 'adversarial validation', 'selective oversight', 'governance capacity', 'continuous scarcity-displacement search', 'human intervention leverage', 'historical failure memory'],
              'next_discriminating_action': 'Formalize a dual-population or test-based constrained multi-objective search model: one population proposes scarcity-displacing strategies; another evolves counterexamples, harms and failure scenarios. Preserve a hall of fame of historical adversaries. Compare against competitive coevolution, interactive evolutionary computation, scalable oversight and safe exploration, and identify at least one falsifiable advantage over ordinary selective oversight.'
          })
          note = 'The worthwhile-future target is not assumed to be one globally valid scalar fitness score; plural objectives, hard constraints, uncertainty, legitimacy and adversarial tests must remain explicit.'
          if note not in portfolio['notes']:
              portfolio['notes'].append(note)
          dump_compact_string_arrays(portfolio_path, portfolio)

          knowledge_path = Path('src/data/knowledgeIndex.json')
          knowledge = json.loads(knowledge_path.read_text())
          direction = next(x for x in knowledge['objects'] if x['id'] == 'direction:constitutional-attention-search')
          direction.update({
              'title': 'Constitutional attention as adversarial co-evolutionary search',
              'summary': 'Co-evolve proposed scarcity-displacing strategies against counterexamples, harms and failure scenarios under plural worthwhile-future objectives, hard constraints, escalation rules and a memory of historical failures.',
              'direction': 'Formalize the proposal/test populations, hall-of-fame memory, escalation boundary and non-scalar fitness/constraint structure before treating the mechanism as more than a research conjecture.'
          })
          if 'method:epistemic-intake' not in direction['related']:
              direction['related'].append('method:epistemic-intake')
          memory = next((x for x in knowledge['objects'] if x['id'] == 'method:memory-palace'), None)
          if memory and 'method:epistemic-intake' not in memory['related']:
              memory['related'].append('method:epistemic-intake')
          if not any(x['id'] == 'method:epistemic-intake' for x in knowledge['objects']):
              intake_method = {
                  'id': 'method:epistemic-intake',
                  'title': 'Epistemic Artefact Intake',
                  'kind': 'protocol',
                  'layer': 'method',
                  'commitment': 'supporting',
                  'meaningful': False,
                  'topics': ['epistemic-artifacts', 'capture', 'provenance', 'assimilation', 'routing'],
                  'status': 'Experimental companion protocol · v0.1',
                  'summary': 'Capture potentially valuable research artefacts immediately while allowing warrant, understanding, novelty and commitment to remain explicitly unresolved.',
                  'direction': 'Keep preservation cheap and route attention only when validation, assimilation, handoff or promotion justifies it.',
                  'href': '/intake/',
                  'related': ['method:memory-palace', 'direction:epistemic-artefacts-assimilation', 'direction:constitutional-attention-search']
              }
              idx = next((i for i, x in enumerate(knowledge['objects']) if x['id'] == 'method:memory-palace'), len(knowledge['objects']) - 1)
              knowledge['objects'].insert(idx + 1, intake_method)
          dump_compact_string_arrays(knowledge_path, knowledge)

          packet_path = Path('docs/sessions/2026-09-07_EPISTEMIC_ARTEFACTS_AND_CONSTITUTIONAL_ATTENTION.md')
          packet = packet_path.read_text()
          heading = '## Session continuation: adversarial constitutional evolution and immediate artefact intake'
          if heading not in packet:
              packet += '''\n\n## Session continuation: adversarial constitutional evolution and immediate artefact intake

The human curator refined constitutional attention into an explicitly **adversarial evolutionary system** and asked that epistemic artefacts be recordable as soon as they appear. This materially changes both the mechanism conjecture and the research operating system.

### Adversarial co-evolutionary formulation

The provisional mechanism now has at least four interacting components:

1. **A constitution** maintained through legitimate human governance: plural descriptions of worthwhile futures, hard safety/rights constraints, uncertainty tolerances, resource boundaries, escalation rules and procedures for constitutional revision.
2. **A strategy population** that searches for mechanisms, institutions, technologies or research moves capable of displacing current scarcities and expanding reachable worthwhile futures.
3. **An adversary/test population** that searches for counterexamples, harms, externalities, excluded stakeholders, distribution shifts, brittleness, gaming and circumstances under which candidate strategies cease to be worthwhile.
4. **A historical challenge archive** or hall of fame that retains past failures and adversaries so apparent progress cannot be created merely by forgetting old ways in which a strategy was broken.

The system should not assume that humanity has one scalar fitness value. A safer provisional representation is a constrained multi-objective landscape: hard constraints can veto candidates; plural objectives remain visible; adversaries search for violations and hidden costs; uncertainty and reversibility affect how much autonomy a candidate earns; and contested value judgments escalate rather than being silently averaged away.

Human attention is therefore concentrated on **constitutional work**: determining and revising worthwhile-future criteria, adjudicating contested values, examining novel failure modes, approving high-impact or irreversible transitions, and auditing whether the search process itself remains legitimate and corrigible. Routine candidate generation, provenance capture, low-risk tests and ordinary rejection can increasingly be automated.

### Lineage correction / narrowing

Competitive co-evolution is an established evolutionary-computation family. Rosin and Belew's 1997 work introduced techniques including a hall of fame to retain strong opponents across generations, and later work explicitly studies adversarial optimization and the danger of cycles or merely apparent progress. Constitutional AI is also an antecedent for explicit principle-guided machine evaluation that reduces direct human labeling. These antecedents mean the Agalmic contribution, if any, must be narrower than either "adversarial evolution" or "a constitution for AI."

The candidate synthesis is: **constitutional, adversarial search for strategies that displace scarcity and expand a plural set of worthwhile reachable futures, with provenance, hard constraints, selective escalation and historical failure memory as integral parts of the search process.** Novelty remains unassessed.

### Epistemic Intake Room

A new low-friction intake layer has been created. Its rule is:

> **Capture first. Judge deliberately. Promote sparingly.**

Material epistemic artefacts should be recordable at emergence time even when warrant is unknown, understanding is incomplete, novelty is unassessed and no commitment has been made. Intake is therefore upstream of the Possibility Portfolio and downstream of discovery events. It separates preservation cost from attention cost.

The first two intake records are this session's epistemic-artefact state model and the adversarial constitutional-attention mechanism.

### New decision

`decision:epistemic-intake-room` preserves material artefacts immediately but does not promote them automatically. Reversal condition: retire or redesign the intake layer if its capture/triage overhead consumes more attention than the epistemic loss it prevents.
'''
              packet_path.write_text(packet)

          prov_path = Path('docs/sessions/2026-09-07_EPISTEMIC_ARTEFACTS_AND_CONSTITUTIONAL_ATTENTION.prov.jsonld')
          prov = json.loads(prov_path.read_text())
          graph = prov['@graph']
          def by_id(node_id):
              return next((n for n in graph if n.get('@id') == node_id), None)
          ce = by_id('ar:entity/constitutional-attention')
          if ce:
              ce['schema:name'] = 'Constitutional attention as adversarial co-evolutionary search'
              ce['schema:description'] = 'A provisional architecture in which scarcity-displacing strategies co-evolve against counterexamples, harms and failure scenarios under a human-governed constitution of plural worthwhile-future objectives, hard constraints, escalation rules and retained historical failures.'
              ce['prov:wasDerivedFrom'] = [
                  {'@id': 'ar:entity/attention-sidestep-question'},
                  {'@id': 'ar:source/interactive-evolutionary-computation'},
                  {'@id': 'ar:source/competitive-coevolution'},
                  {'@id': 'ar:source/constitutional-ai'},
                  {'@id': 'ar:source/selective-human-oversight'}
              ]
          additions = [
              {
                  '@id': 'ar:activity/adversarial-constitutional-refinement',
                  '@type': ['prov:Activity', 'ar:ConceptualizationEvent'],
                  'schema:name': 'Refine constitutional attention into adversarial co-evolutionary search',
                  'prov:used': {'@id': 'ar:entity/constitutional-attention'},
                  'prov:wasAssociatedWith': {'@id': 'ar:agent/human-curator', 'prov:hadRole': [{'@id': 'credit:conceptualization'}, {'@id': 'ar:role/reframer'}]},
                  'prov:generated': {'@id': 'ar:entity/adversarial-constitutional-search'},
                  'ar:attributionConfidence': 'high',
                  'ar:attributionMode': 'contemporaneous'
              },
              {
                  '@id': 'ar:entity/adversarial-constitutional-search',
                  '@type': ['prov:Entity', 'ar:MechanismConjecture'],
                  'schema:name': 'Adversarial constitutional search for scarcity-displacing strategies',
                  'schema:description': 'Candidate strategies and adversarial tests co-evolve under plural worthwhile-future objectives, hard constraints, escalation rules and a historical archive of past failures.',
                  'prov:wasGeneratedBy': {'@id': 'ar:activity/adversarial-constitutional-refinement'},
                  'prov:wasDerivedFrom': [{'@id': 'ar:entity/constitutional-attention'}, {'@id': 'ar:source/competitive-coevolution'}, {'@id': 'ar:source/constitutional-ai'}],
                  'ar:epistemicStatus': 'exploratory',
                  'ar:noveltyStatus': 'mature antecedent families plus synthesis; novelty unassessed',
                  'ar:handoffNeeded': ['evolutionary computation', 'multi-objective optimization', 'AI safety and governance', 'value/governance design']
              },
              {
                  '@id': 'ar:activity/epistemic-intake-framing',
                  '@type': ['prov:Activity', 'ar:ConceptualizationEvent'],
                  'schema:name': 'Request immediate recording of epistemic artefacts',
                  'prov:wasAssociatedWith': {'@id': 'ar:agent/human-curator', 'prov:hadRole': [{'@id': 'credit:conceptualization'}, {'@id': 'ar:role/initiator'}]},
                  'prov:generated': {'@id': 'ar:entity/epistemic-intake-room'},
                  'ar:attributionConfidence': 'high',
                  'ar:attributionMode': 'contemporaneous'
              },
              {
                  '@id': 'ar:entity/epistemic-intake-room',
                  '@type': ['prov:Entity', 'ar:ResearchMethod'],
                  'schema:name': 'Epistemic Artefact Intake Room',
                  'schema:description': 'Low-friction capture of material epistemic artefacts before warrant, understanding, novelty or commitment has been resolved.',
                  'prov:wasGeneratedBy': {'@id': 'ar:activity/epistemic-intake-framing'},
                  'ar:epistemicStatus': 'experimental operating method',
                  'ar:branchState': 'supporting-method'
              },
              {
                  '@id': 'ar:source/competitive-coevolution',
                  '@type': ['prov:Entity', 'schema:ScholarlyArticle', 'ar:PriorArt'],
                  'schema:name': 'New Methods for Competitive Coevolution',
                  'schema:author': ['Christopher D. Rosin', 'Richard K. Belew'],
                  'schema:datePublished': '1997',
                  'schema:identifier': 'doi:10.1162/evco.1997.5.1.1',
                  'ar:influence': 'Provides direct antecedents for competitive coevolution, adversarial test populations and hall-of-fame memory across generations.'
              },
              {
                  '@id': 'ar:source/constitutional-ai',
                  '@type': ['prov:Entity', 'ar:PriorArt'],
                  'schema:name': 'Constitutional AI: Harmlessness from AI Feedback',
                  'schema:datePublished': '2022',
                  'schema:url': 'https://www.anthropic.com/news/constitutional-ai-harmlessness-from-ai-feedback',
                  'ar:influence': 'Provides an antecedent for explicit principles guiding machine critique/evaluation with reduced direct human labeling.'
              }
          ]
          existing = {n.get('@id') for n in graph}
          graph.extend(n for n in additions if n['@id'] not in existing)
          ext = prov.get('ar:extensionPatch', {})
          for decision in [
              'create an Epistemic Artefact Intake Room for immediate low-cost capture without automatic promotion',
              'refine constitutional attention into adversarial co-evolutionary search with historical failure memory and non-scalar worthwhile-future constraints'
          ]:
              if decision not in ext.get('decisions', []):
                  ext.setdefault('decisions', []).append(decision)
          if not any(x.get('object') == 'adversarial constitutional search' for x in ext.get('novelty_updates', [])):
              ext.setdefault('novelty_updates', []).append({'object': 'adversarial constitutional search', 'before': 'unassessed', 'after': 'competitive coevolution + constitutional oversight antecedents; synthesis novelty unassessed'})
          prov_path.write_text(json.dumps(prov, indent=2, ensure_ascii=False) + '\n')

          memory_page_path = Path('src/pages/memory-palace-protocol.astro')
          memory_page = memory_page_path.read_text()
          if '<p class="eyebrow">Epistemic intake</p>' not in memory_page:
              anchor = '''  <section class="section">
    <div class="shell split">
      <div>
        <p class="eyebrow">Novelty discipline</p>'''
              section = '''  <section class="section">
    <div class="shell split">
      <div>
        <p class="eyebrow">Epistemic intake</p>
        <h2>Give new artefacts a room before asking what they are.</h2>
      </div>
      <div class="prose">
        <p class="large">Capture can be immediate even when judgment cannot.</p>
        <p>The Epistemic Intake Room records materially distinct research artefacts with provenance while allowing warrant, understanding, novelty and commitment to remain unresolved. Entry is deliberately cheap and does not promote an artefact to knowledge or active work.</p>
        <div class="callout"><p><strong>Capture first. Judge deliberately. Promote sparingly.</strong></p></div>
        <div class="actions">
          <a class="button" href={internal('intake')}>Enter Epistemic Intake</a>
          <a class="button secondary" href="https://github.com/TsatsuAmable/agalmicresearch/blob/main/docs/EPISTEMIC_ARTEFACT_INTAKE.md">Intake protocol ↗</a>
        </div>
      </div>
    </div>
  </section>

'''
              if anchor not in memory_page:
                  raise SystemExit('memory page insertion point not found')
              memory_page = memory_page.replace(anchor, section + anchor, 1)
              memory_page = memory_page.replace('Memory Palace v0.3 + Frontier companion v0.1', 'Memory Palace v0.3 + Frontier companion v0.1 + Intake companion v0.1', 1)
              memory_page = memory_page.replace('The Memory Palace preserves how research emerged. The companion Possibility Portfolio prevents preservation from turning every branch into an obligation by separating the abundant option set from a deliberately small Active Frontier.', 'The Memory Palace preserves how research emerged. Epistemic Intake catches materially distinct artefacts before judgment. The companion Possibility Portfolio prevents preservation from turning every branch into an obligation by separating the abundant option set from a deliberately small Active Frontier.', 1)
              memory_page_path.write_text(memory_page)

          validator_path = Path('scripts/validate-knowledge-index.mjs')
          validator = validator_path.read_text()
          if "readJson('src/data/epistemicArtefactInbox.json')" not in validator:
              validator = validator.replace("const history = readJson('src/data/knowledgeHistory.json');", "const history = readJson('src/data/knowledgeHistory.json');\nconst intake = readJson('src/data/epistemicArtefactInbox.json');", 1)
              anchor = "const historyIds = unique(history.events.map((event) => event.id), 'knowledge history');"
              block = '''const intakeIds = unique(intake.records.map((item) => item.id), 'epistemic artefact intake');
for (const item of intake.records) {
  for (const field of ['id', 'captured', 'title', 'kind', 'origin_session', 'summary', 'provenance_pointer', 'warrant_status', 'understanding_status', 'novelty_status', 'publication_sensitivity', 'commitment', 'next_route']) {
    if (item[field] === undefined || item[field] === null || item[field] === '') fail(`${item.id ?? 'intake record'}: missing ${field}`);
  }
  if (item.related_possibility && !possibilityIds.has(item.related_possibility)) fail(`${item.id}: related possibility ${item.related_possibility} does not exist`);
}

'''
              if anchor not in validator:
                  raise SystemExit('validator insertion point not found')
              validator = validator.replace(anchor, block + anchor, 1)
              old_log = "console.log(`knowledge-check passed: ${knowledge.objects.length} indexed objects, ${portfolio.possibilities.length} possibilities, ${handoffs.handoffs.length} handoffs, ${history.events.length} history events`);"
              new_log = "console.log(`knowledge-check passed: ${knowledge.objects.length} indexed objects, ${portfolio.possibilities.length} possibilities, ${intake.records.length} intake artefacts, ${handoffs.handoffs.length} handoffs, ${history.events.length} history events`);"
              if old_log not in validator:
                  raise SystemExit('validator log line not found')
              validator = validator.replace(old_log, new_log, 1)
              validator_path.write_text(validator)
          PY
      - name: Install dependencies and validate
        run: |
          npm ci
          node -e "JSON.parse(require('node:fs').readFileSync('src/data/epistemicArtefactInbox.json','utf8')); JSON.parse(require('node:fs').readFileSync('docs/sessions/2026-09-07_EPISTEMIC_ARTEFACTS_AND_CONSTITUTIONAL_ATTENTION.prov.jsonld','utf8')); console.log('intake and provenance JSON syntax OK')"
          npm run build
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-constitutional-refinement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs src/data src/pages scripts/validate-knowledge-index.mjs .github/workflows/apply-constitutional-refinement.yml
          git commit -m "Refine constitutional attention and wire epistemic intake"
          git push origin HEAD:research/epistemic-artefacts-constitutional-attention
