name: Correct session source identifier

on:
  push:
    branches:
      - research/epistemic-artefacts-constitutional-attention

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/epistemic-artefacts-constitutional-attention
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Correct source identifier and validate
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/sessions/2026-09-07_EPISTEMIC_ARTEFACTS_AND_CONSTITUTIONAL_ATTENTION.prov.jsonld';
          let text = fs.readFileSync(path, 'utf8');
          const stale = 'ar:source/knuuttila-voutilainen-2022';
          const corrected = 'ar:source/knuuttila-voutilainen-2003';
          const count = text.split(stale).length - 1;
          if (count < 1) throw new Error('expected stale source identifier not found');
          text = text.split(stale).join(corrected);
          JSON.parse(text);
          fs.writeFileSync(path, text);
          NODE
          npm ci
          npm run build
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/fix-session-source-id.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sessions/2026-09-07_EPISTEMIC_ARTEFACTS_AND_CONSTITUTIONAL_ATTENTION.prov.jsonld .github/workflows/fix-session-source-id.yml
          git commit -m "Correct provenance source identifier"
          git push origin HEAD:research/epistemic-artefacts-constitutional-attention
