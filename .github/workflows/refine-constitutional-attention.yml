name: Refine constitutional attention and epistemic intake

on:
  push:
    branches:
      - research/epistemic-artefacts-constitutional-attention

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/epistemic-artefacts-constitutional-attention
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Refine research records
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const compactStringArrays = (text) => text.replace(
            /\[\n((?:\s+"(?:[^"\\]|\\.)*"(?:,\n|\n))+?)\s*\]/g,
            (match, body) => {
              const values = body.split('\n').map((line) => line.trim().replace(/,$/, '')).filter(Boolean);
              return `[${values.join(', ')}]`;
            }
          );

          // Refine the possibility portfolio without changing the three-item Active Frontier.
          const portfolioPath = 'src/data/possibilityPortfolio.json';
          const portfolio = JSON.parse(fs.readFileSync(portfolioPath, 'utf8'));
          const constitutional = portfolio.possibilities.find((item) => item.id === 'possibility:constitutional-attention-search');
          if (!constitutional) throw new Error('missing constitutional-attention possibility');
          constitutional.title = 'Constitutional attention as adversarial co-evolutionary search';
          constitutional.summary = 'Explore a governance/search architecture in which candidate strategies for scarcity displacement co-evolve against adversarial tests, counterexamples and failure scenarios under a human-governed constitution of plural worthwhile-future objectives, hard constraints, escalation rules and retained historical failures.';
          constitutional.lineage_status = 'competitive coevolution + interactive evolutionary computation + constitutional/selective oversight + autonomous discovery antecedents; synthesis novelty unassessed';
          constitutional.lineage_sources = [
            'Rosin & Belew 1997 / competitive coevolution and hall-of-fame archives',
            'competitive coevolution / adversarial optimization literature',
            'interactive evolutionary computation',
            'Constitutional AI / principle-guided scalable oversight',
            'meaningful/selective human oversight',
            'safe and multi-objective optimization not yet deeply reviewed'
          ];
          constitutional.worthwhile_future = 'Much larger safe search and realization capacity in which proposed paths to worthwhile futures must survive active attempts to expose harms, externalities, brittleness, exclusion and reward hacking without requiring item-level human attention to scale linearly with machine cognition.';
          constitutional.capacity_created = ['search leverage', 'adversarial validation', 'selective oversight', 'governance capacity', 'continuous scarcity-displacement search', 'human intervention leverage', 'historical failure memory'];
          constitutional.next_discriminating_action = 'Formalize a dual-population or test-based constrained multi-objective search model: one population proposes scarcity-displacing strategies; another evolves counterexamples, harms and failure scenarios. Preserve a hall of fame of historical adversaries. Compare against competitive coevolution, interactive evolutionary computation, scalable oversight and safe exploration, and identify at least one falsifiable advantage over ordinary selective oversight.';
          if (!portfolio.notes.includes('The worthwhile-future target is not assumed to be one globally valid scalar fitness score; plural objectives, hard constraints, uncertainty, legitimacy and adversarial tests must remain explicit.')) {
            portfolio.notes.push('The worthwhile-future target is not assumed to be one globally valid scalar fitness score; plural objectives, hard constraints, uncertainty, legitimacy and adversarial tests must remain explicit.');
          }
          fs.writeFileSync(portfolioPath, compactStringArrays(JSON.stringify(portfolio, null, 2)) + '\n');

          // Add intake to the semantic discovery index and refine the constitutional direction.
          const knowledgePath = 'src/data/knowledgeIndex.json';
          const knowledge = JSON.parse(fs.readFileSync(knowledgePath, 'utf8'));
          const direction = knowledge.objects.find((item) => item.id === 'direction:constitutional-attention-search');
          if (!direction) throw new Error('missing constitutional-attention direction');
          direction.title = 'Constitutional attention as adversarial co-evolutionary search';
          direction.summary = 'Co-evolve proposed scarcity-displacing strategies against counterexamples, harms and failure scenarios under plural worthwhile-future objectives, hard constraints, escalation rules and a memory of historical failures.';
          direction.direction = 'Formalize the proposal/test populations, hall-of-fame memory, escalation boundary and non-scalar fitness/constraint structure before treating the mechanism as more than a research conjecture.';
          if (!direction.related.includes('method:epistemic-intake')) direction.related.push('method:epistemic-intake');

          const memory = knowledge.objects.find((item) => item.id === 'method:memory-palace');
          if (memory && !memory.related.includes('method:epistemic-intake')) memory.related.push('method:epistemic-intake');

          if (!knowledge.objects.some((item) => item.id === 'method:epistemic-intake')) {
            const methodIndex = knowledge.objects.findIndex((item) => item.id === 'method:memory-palace');
            const intakeMethod = {
              id: 'method:epistemic-intake',
              title: 'Epistemic Artefact Intake',
              kind: 'protocol',
              layer: 'method',
              commitment: 'supporting',
              meaningful: false,
              topics: ['epistemic-artifacts', 'capture', 'provenance', 'assimilation', 'routing'],
              status: 'Experimental companion protocol · v0.1',
              summary: 'Capture potentially valuable research artefacts immediately while allowing warrant, understanding, novelty and commitment to remain explicitly unresolved.',
              direction: 'Keep preservation cheap and route attention only when validation, assimilation, handoff or promotion justifies it.',
              href: '/intake/',
              related: ['method:memory-palace', 'direction:epistemic-artefacts-assimilation', 'direction:constitutional-attention-search']
            };
            knowledge.objects.splice(methodIndex >= 0 ? methodIndex + 1 : knowledge.objects.length, 0, intakeMethod);
          }
          fs.writeFileSync(knowledgePath, compactStringArrays(JSON.stringify(knowledge, null, 2)) + '\n');

          // Append a contemporaneous continuation to the Memory Palace packet.
          const packetPath = 'docs/sessions/2026-09-07_EPISTEMIC_ARTEFACTS_AND_CONSTITUTIONAL_ATTENTION.md';
          let packet = fs.readFileSync(packetPath, 'utf8');
          const continuationHeading = '## Session continuation: adversarial constitutional evolution and immediate artefact intake';
          if (!packet.includes(continuationHeading)) {
            packet += `\n\n${continuationHeading}\n\nThe human curator refined constitutional attention into an explicitly **adversarial evolutionary system** and asked that epistemic artefacts be recordable as soon as they appear. This materially changes both the mechanism conjecture and the research operating system.\n\n### Adversarial co-evolutionary formulation\n\nThe provisional mechanism now has at least four interacting components:\n\n1. **A constitution** maintained through legitimate human governance: plural descriptions of worthwhile futures, hard safety/rights constraints, uncertainty tolerances, resource boundaries, escalation rules and procedures for constitutional revision.\n2. **A strategy population** that searches for mechanisms, institutions, technologies or research moves capable of displacing current scarcities and expanding reachable worthwhile futures.\n3. **An adversary/test population** that searches for counterexamples, harms, externalities, excluded stakeholders, distribution shifts, brittleness, gaming and circumstances under which candidate strategies cease to be worthwhile.\n4. **A historical challenge archive** or hall of fame that retains past failures and adversaries so apparent progress cannot be created merely by forgetting old ways in which a strategy was broken.\n\nThe system should not assume that humanity has one scalar fitness value. A safer provisional representation is a constrained multi-objective landscape: hard constraints can veto candidates; plural objectives remain visible; adversaries search for violations and hidden costs; uncertainty and reversibility affect how much autonomy a candidate earns; and contested value judgments escalate rather than being silently averaged away.\n\nHuman attention is therefore concentrated on **constitutional work**: determining and revising worthwhile-future criteria, adjudicating contested values, examining novel failure modes, approving high-impact or irreversible transitions, and auditing whether the search process itself remains legitimate and corrigible. Routine candidate generation, provenance capture, low-risk tests and ordinary rejection can increasingly be automated.\n\n### Lineage correction / narrowing\n\nCompetitive co-evolution is an established evolutionary-computation family. Rosin and Belew's 1997 work introduced techniques including a hall of fame to retain strong opponents across generations, and later work explicitly studies adversarial optimization and the danger of cycles or merely apparent progress. Constitutional AI is also an antecedent for explicit principle-guided machine evaluation that reduces direct human labeling. These antecedents mean the Agalmic contribution, if any, must be narrower than either "adversarial evolution" or "a constitution for AI."\n\nThe candidate synthesis is: **constitutional, adversarial search for strategies that displace scarcity and expand a plural set of worthwhile reachable futures, with provenance, hard constraints, selective escalation and historical failure memory as integral parts of the search process.** Novelty remains unassessed.\n\n### Epistemic Intake Room\n\nA new low-friction intake layer has been created. Its rule is:\n\n> **Capture first. Judge deliberately. Promote sparingly.**\n\nMaterial epistemic artefacts should be recordable at emergence time even when warrant is unknown, understanding is incomplete, novelty is unassessed and no commitment has been made. Intake is therefore upstream of the Possibility Portfolio and downstream of discovery events. It separates preservation cost from attention cost.\n\nThe first two intake records are this session's epistemic-artefact state model and the adversarial constitutional-attention mechanism.\n\n### New decision\n\n`decision:epistemic-intake-room` preserves material artefacts immediately but does not promote them automatically. Reversal condition: retire or redesign the intake layer if its capture/triage overhead consumes more attention than the epistemic loss it prevents.\n`;
            fs.writeFileSync(packetPath, packet);
          }

          // Extend the experimental provenance graph with the continuation event and antecedents.
          const provPath = 'docs/sessions/2026-09-07_EPISTEMIC_ARTEFACTS_AND_CONSTITUTIONAL_ATTENTION.prov.jsonld';
          const prov = JSON.parse(fs.readFileSync(provPath, 'utf8'));
          const graph = prov['@graph'];
          const has = (id) => graph.some((node) => node['@id'] === id);
          const constitutionalEntity = graph.find((node) => node['@id'] === 'ar:entity/constitutional-attention');
          if (constitutionalEntity) {
            constitutionalEntity['schema:name'] = 'Constitutional attention as adversarial co-evolutionary search';
            constitutionalEntity['schema:description'] = 'A provisional architecture in which scarcity-displacing strategies co-evolve against counterexamples, harms and failure scenarios under a human-governed constitution of plural worthwhile-future objectives, hard constraints, escalation rules and retained historical failures.';
            constitutionalEntity['prov:wasDerivedFrom'] = [
              { '@id': 'ar:entity/attention-sidestep-question' },
              { '@id': 'ar:source/interactive-evolutionary-computation' },
              { '@id': 'ar:source/competitive-coevolution' },
              { '@id': 'ar:source/constitutional-ai' },
              { '@id': 'ar:source/selective-human-oversight' }
            ];
          }
          if (!has('ar:activity/adversarial-constitutional-refinement')) graph.push({
            '@id': 'ar:activity/adversarial-constitutional-refinement',
            '@type': ['prov:Activity', 'ar:ConceptualizationEvent'],
            'schema:name': 'Refine constitutional attention into adversarial co-evolutionary search',
            'prov:used': { '@id': 'ar:entity/constitutional-attention' },
            'prov:wasAssociatedWith': {
              '@id': 'ar:agent/human-curator',
              'prov:hadRole': [
                { '@id': 'credit:conceptualization' },
                { '@id': 'ar:role/reframer' }
              ]
            },
            'prov:generated': { '@id': 'ar:entity/adversarial-constitutional-search' },
            'ar:attributionConfidence': 'high',
            'ar:attributionMode': 'contemporaneous'
          });
          if (!has('ar:entity/adversarial-constitutional-search')) graph.push({
            '@id': 'ar:entity/adversarial-constitutional-search',
            '@type': ['prov:Entity', 'ar:MechanismConjecture'],
            'schema:name': 'Adversarial constitutional search for scarcity-displacing strategies',
            'schema:description': 'Candidate strategies and adversarial tests co-evolve under plural worthwhile-future objectives, hard constraints, escalation rules and a historical archive of past failures.',
            'prov:wasGeneratedBy': { '@id': 'ar:activity/adversarial-constitutional-refinement' },
            'prov:wasDerivedFrom': [
              { '@id': 'ar:entity/constitutional-attention' },
              { '@id': 'ar:source/competitive-coevolution' },
              { '@id': 'ar:source/constitutional-ai' }
            ],
            'ar:epistemicStatus': 'exploratory',
            'ar:noveltyStatus': 'mature antecedent families plus synthesis; novelty unassessed',
            'ar:handoffNeeded': ['evolutionary computation', 'multi-objective optimization', 'AI safety and governance', 'value/governance design']
          });
          if (!has('ar:activity/epistemic-intake-framing')) graph.push({
            '@id': 'ar:activity/epistemic-intake-framing',
            '@type': ['prov:Activity', 'ar:ConceptualizationEvent'],
            'schema:name': 'Request immediate recording of epistemic artefacts',
            'prov:wasAssociatedWith': {
              '@id': 'ar:agent/human-curator',
              'prov:hadRole': [
                { '@id': 'credit:conceptualization' },
                { '@id': 'ar:role/initiator' }
              ]
            },
            'prov:generated': { '@id': 'ar:entity/epistemic-intake-room' },
            'ar:attributionConfidence': 'high',
            'ar:attributionMode': 'contemporaneous'
          });
          if (!has('ar:entity/epistemic-intake-room')) graph.push({
            '@id': 'ar:entity/epistemic-intake-room',
            '@type': ['prov:Entity', 'ar:ResearchMethod'],
            'schema:name': 'Epistemic Artefact Intake Room',
            'schema:description': 'Low-friction capture of material epistemic artefacts before warrant, understanding, novelty or commitment has been resolved.',
            'prov:wasGeneratedBy': { '@id': 'ar:activity/epistemic-intake-framing' },
            'ar:epistemicStatus': 'experimental operating method',
            'ar:branchState': 'supporting-method'
          });
          if (!has('ar:source/competitive-coevolution')) graph.push({
            '@id': 'ar:source/competitive-coevolution',
            '@type': ['prov:Entity', 'schema:ScholarlyArticle', 'ar:PriorArt'],
            'schema:name': 'New Methods for Competitive Coevolution',
            'schema:author': ['Christopher D. Rosin', 'Richard K. Belew'],
            'schema:datePublished': '1997',
            'schema:identifier': 'doi:10.1162/evco.1997.5.1.1',
            'ar:influence': 'Provides direct antecedents for competitive coevolution, adversarial test populations and hall-of-fame memory across generations.'
          });
          if (!has('ar:source/constitutional-ai')) graph.push({
            '@id': 'ar:source/constitutional-ai',
            '@type': ['prov:Entity', 'ar:PriorArt'],
            'schema:name': 'Constitutional AI: Harmlessness from AI Feedback',
            'schema:datePublished': '2022',
            'schema:url': 'https://www.anthropic.com/news/constitutional-ai-harmlessness-from-ai-feedback',
            'ar:influence': 'Provides an antecedent for explicit principles guiding machine critique/evaluation with reduced direct human labeling.'
          });
          const ext = prov['ar:extensionPatch'];
          if (ext && !ext.decisions.includes('create an Epistemic Artefact Intake Room for immediate low-cost capture without automatic promotion')) {
            ext.decisions.push('create an Epistemic Artefact Intake Room for immediate low-cost capture without automatic promotion');
            ext.decisions.push('refine constitutional attention into adversarial co-evolutionary search with historical failure memory and non-scalar worthwhile-future constraints');
            ext.novelty_updates.push({
              object: 'adversarial constitutional search',
              before: 'unassessed',
              after: 'competitive coevolution + constitutional oversight antecedents; synthesis novelty unassessed'
            });
          }
          fs.writeFileSync(provPath, JSON.stringify(prov, null, 2) + '\n');

          // Wire the intake room into the Memory Palace page without making it top-level navigation.
          const memoryPagePath = 'src/pages/memory-palace-protocol.astro';
          let memoryPage = fs.readFileSync(memoryPagePath, 'utf8');
          const intakeMarker = '<p class="eyebrow">Epistemic intake</p>';
          if (!memoryPage.includes(intakeMarker)) {
            const before = '  <section class="section">\n    <div class="shell split">\n      <div>\n        <p class="eyebrow">Novelty discipline</p>';
            const section = `  <section class="section">\n    <div class="shell split">\n      <div>\n        <p class="eyebrow">Epistemic intake</p>\n        <h2>Give new artefacts a room before asking what they are.</h2>\n      </div>\n      <div class="prose">\n        <p class="large">Capture can be immediate even when judgment cannot.</p>\n        <p>The Epistemic Intake Room records materially distinct research artefacts with provenance while allowing warrant, understanding, novelty and commitment to remain unresolved. Entry is deliberately cheap and does not promote an artefact to knowledge or active work.</p>\n        <div class="callout"><p><strong>Capture first. Judge deliberately. Promote sparingly.</strong></p></div>\n        <div class="actions">\n          <a class="button" href={internal('intake')}>Enter Epistemic Intake</a>\n          <a class="button secondary" href="https://github.com/TsatsuAmable/agalmicresearch/blob/main/docs/EPISTEMIC_ARTEFACT_INTAKE.md">Intake protocol ↗</a>\n        </div>\n      </div>\n    </div>\n  </section>\n\n`;
            if (!memoryPage.includes(before)) throw new Error('memory page insertion point not found');
            memoryPage = memoryPage.replace(before, section + before);
            memoryPage = memoryPage.replace(
              'Memory Palace v0.3 + Frontier companion v0.1',
              'Memory Palace v0.3 + Frontier companion v0.1 + Intake companion v0.1'
            );
            memoryPage = memoryPage.replace(
              'The Memory Palace preserves how research emerged. The companion Possibility Portfolio prevents preservation from turning every branch into an obligation by separating the abundant option set from a deliberately small Active Frontier.',
              'The Memory Palace preserves how research emerged. Epistemic Intake catches materially distinct artefacts before judgment. The companion Possibility Portfolio prevents preservation from turning every branch into an obligation by separating the abundant option set from a deliberately small Active Frontier.'
            );
            fs.writeFileSync(memoryPagePath, memoryPage);
          }

          // Extend repository validation to make the intake room a maintained data surface.
          const validatorPath = 'scripts/validate-knowledge-index.mjs';
          let validator = fs.readFileSync(validatorPath, 'utf8');
          if (!validator.includes("readJson('src/data/epistemicArtefactInbox.json')")) {
            validator = validator.replace(
              "const history = readJson('src/data/knowledgeHistory.json');",
              "const history = readJson('src/data/knowledgeHistory.json');\nconst intake = readJson('src/data/epistemicArtefactInbox.json');"
            );
            const insertionPoint = "const historyIds = unique(history.events.map((event) => event.id), 'knowledge history');";
            const intakeValidation = `const intakeIds = unique(intake.records.map((item) => item.id), 'epistemic artefact intake');\nfor (const item of intake.records) {\n  for (const field of ['id', 'captured', 'title', 'kind', 'origin_session', 'summary', 'provenance_pointer', 'warrant_status', 'understanding_status', 'novelty_status', 'publication_sensitivity', 'commitment', 'next_route']) {\n    if (item[field] === undefined || item[field] === null || item[field] === '') fail(\`${'${item.id ?? \'intake record\'}'}: missing ${'${field}'}\`);\n  }\n  if (item.related_possibility && !possibilityIds.has(item.related_possibility)) fail(\`${'${item.id}'}: related possibility ${'${item.related_possibility}'} does not exist\`);\n}\n\n`;
            if (!validator.includes(insertionPoint)) throw new Error('validator insertion point not found');
            validator = validator.replace(insertionPoint, intakeValidation + insertionPoint);
            validator = validator.replace(
              "console.log(`knowledge-check passed: ${knowledge.objects.length} indexed objects, ${portfolio.possibilities.length} possibilities, ${handoffs.handoffs.length} handoffs, ${history.events.length} history events`);",
              "console.log(`knowledge-check passed: ${knowledge.objects.length} indexed objects, ${portfolio.possibilities.length} possibilities, ${intake.records.length} intake artefacts, ${handoffs.handoffs.length} handoffs, ${history.events.length} history events`);"
            );
            fs.writeFileSync(validatorPath, validator);
          }
          NODE
      - name: Install dependencies and validate
        run: |
          npm ci
          node -e "JSON.parse(require('node:fs').readFileSync('src/data/epistemicArtefactInbox.json','utf8')); JSON.parse(require('node:fs').readFileSync('docs/sessions/2026-09-07_EPISTEMIC_ARTEFACTS_AND_CONSTITUTIONAL_ATTENTION.prov.jsonld','utf8')); console.log('intake and provenance JSON syntax OK')"
          npm run build
      - name: Remove one-shot workflow and commit refinement
        run: |
          rm .github/workflows/refine-constitutional-attention.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs src/data src/pages scripts/validate-knowledge-index.mjs .github/workflows/refine-constitutional-attention.yml
          git commit -m "Refine constitutional attention and wire epistemic intake"
          git push origin HEAD:research/epistemic-artefacts-constitutional-attention
