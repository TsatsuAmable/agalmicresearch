name: Capture epistemic session

on:
  push:
    branches:
      - research/epistemic-artefacts-constitutional-attention

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/epistemic-artefacts-constitutional-attention
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Correct lineage metadata and patch discovery registers
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const packetPath = 'docs/sessions/2026-09-07_EPISTEMIC_ARTEFACTS_AND_CONSTITUTIONAL_ATTENTION.md';
          let packet = fs.readFileSync(packetPath, 'utf8');
          packet = packet.replace(
            'Tarja Knuuttila and Atro Voutilainen, "A Parser as an Epistemic Artifact: A Material View on Models," *Philosophy of Science* 89(5), published online 2022. DOI: `10.1017/psa.2021.34`.',
            'Tarja Knuuttila and Atro Voutilainen, "A Parser as an Epistemic Artifact: A Material View on Models," *Philosophy of Science* 70(5), 2003, 1484-1495. DOI: `10.1086/377424`.'
          );
          if (packet.includes('10.1017/psa.2021.34')) throw new Error('stale Knuuttila DOI remains in packet');
          fs.writeFileSync(packetPath, packet);

          const provPath = 'docs/sessions/2026-09-07_EPISTEMIC_ARTEFACTS_AND_CONSTITUTIONAL_ATTENTION.prov.jsonld';
          let provText = fs.readFileSync(provPath, 'utf8')
            .replace('"schema:datePublished": "2022",', '"schema:datePublished": "2003",')
            .replace('"schema:identifier": "doi:10.1017/psa.2021.34",', '"schema:identifier": "doi:10.1086/377424",');
          if (provText.includes('10.1017/psa.2021.34')) throw new Error('stale Knuuttila DOI remains in JSON-LD');
          JSON.parse(provText);
          fs.writeFileSync(provPath, provText);

          const portfolioPath = 'src/data/possibilityPortfolio.json';
          const portfolio = JSON.parse(fs.readFileSync(portfolioPath, 'utf8'));
          const byId = (id) => portfolio.possibilities.find((item) => item.id === id);

          const meta = byId('possibility:frontier-expansion-meta-aim');
          if (!meta) throw new Error('missing frontier-expansion meta aim');
          meta.summary = "Develop the programme's meta aim as a lineage-grounded synthesis: cognitive tools and autonomous search systems matter insofar as they improve the capacity to generate, recognize, validate, assimilate and realize worthwhile possibilities while safely displacing whichever constraints currently limit the reachable frontier.";
          meta.capacity_created = ['direction-setting', 'selection criterion', 'search capacity', 'assimilation capacity', 'future option value'];
          meta.next_discriminating_action = 'Formalize a minimal frontier-search model that distinguishes candidate generation, epistemic artefact production, warrant, assimilation and realization; test whether constitutional attention can move human effort from item review toward objective, constraint and escalation design without unsafe specification or Goodhart effects.';

          const provenance = byId('possibility:distributed-discovery-provenance');
          if (!provenance) throw new Error('missing distributed-discovery provenance item');
          provenance.next_discriminating_action = 'Use the 7 September 2026 epistemic-artefacts/constitutional-attention session as the first end-to-end discovery episode; review its PROV-aligned JSON-LD, CRediT roles and local authority metadata against PROV-O/RO-Crate and document only genuine standards gaps.';

          const addPossibility = (item) => {
            if (!byId(item.id)) portfolio.possibilities.push(item);
          };

          addPossibility({
            id: 'possibility:epistemic-artefacts-assimilation',
            title: 'Epistemic artefacts, assimilation and frontier formation',
            state: 'option',
            summary: 'Distinguish outputs of directed human-machine search from assimilated knowledge by modeling epistemic artefacts, warrant, agent-relative understanding, assimilation, capability and frontier effects separately.',
            lineage_status: 'established epistemic-artifact and epistemic-opacity antecedents + synthesis/application; novelty unassessed',
            lineage_sources: [
              'Knuuttila & Voutilainen 2003 / epistemic artifacts',
              'Paul Humphreys / epistemic opacity',
              'knowledge-artifact literature'
            ],
            worthwhile_future: 'Machine-generated discoveries can be preserved, validated, routed and used without pretending that every human participant understands or can defend them.',
            capacity_created: ['epistemic-state representation', 'validation routing', 'safer authority assignment', 'discovery provenance', 'assimilation research'],
            frontier_leverage: 'strong',
            information_gain: 'strong',
            realization_path: 'plausible',
            attention_burden: 'medium',
            uncertainty: 'high',
            next_discriminating_action: 'Run a deeper philosophy-of-science, social-epistemology and distributed-cognition lineage review, then test the state model against three real discovery episodes.',
            publication_sensitivity: 'public'
          });

          addPossibility({
            id: 'possibility:constitutional-attention-search',
            title: 'Constitutional attention for continuous scarcity-displacement search',
            state: 'option',
            summary: 'Explore a governance/search architecture in which scarce human intervention shapes worthwhile-future objectives, constraints, escalation and constitutional updates while autonomous systems search for strategies that displace scarcity and expand the reachable frontier.',
            lineage_status: 'interactive evolutionary computation + selective human oversight + autonomous discovery antecedents; terminology/synthesis novelty unassessed',
            lineage_sources: [
              'interactive evolutionary computation',
              'meaningful/selective human oversight',
              'autonomous scientific discovery',
              'safe and multi-objective optimization not yet deeply reviewed'
            ],
            worthwhile_future: 'Much larger safe search and realization capacity without requiring item-level human attention, subject mastery or review capacity to scale linearly with machine cognition.',
            capacity_created: ['search leverage', 'selective oversight', 'governance capacity', 'continuous scarcity-displacement search', 'human intervention leverage'],
            frontier_leverage: 'strong',
            information_gain: 'strong',
            realization_path: 'plausible',
            attention_burden: 'medium',
            uncertainty: 'high',
            next_discriminating_action: 'Formalize a constrained multi-objective search model and compare it with interactive evolutionary computation, scalable oversight, safe exploration and AI-governance antecedents; identify at least one falsifiable advantage over ordinary selective oversight.',
            publication_sensitivity: 'public'
          });

          const note1 = 'Epistemic artefact is established terminology in philosophy of science; this portfolio does not claim to originate it.';
          const note2 = 'Constitutional attention is provisional local terminology for a synthesis under lineage review, not a validated novelty claim.';
          if (!portfolio.notes.includes(note1)) portfolio.notes.push(note1);
          if (!portfolio.notes.includes(note2)) portfolio.notes.push(note2);
          fs.writeFileSync(portfolioPath, JSON.stringify(portfolio, null, 2) + '\n');

          const knowledgePath = 'src/data/knowledgeIndex.json';
          const knowledge = JSON.parse(fs.readFileSync(knowledgePath, 'utf8'));
          const knowledgeById = (id) => knowledge.objects.find((item) => item.id === id);

          const metaDirection = knowledgeById('direction:effective-adjacent-possible');
          if (!metaDirection) throw new Error('missing effective-adjacent-possible direction');
          metaDirection.summary = 'Develop the meta aim as a lineage-grounded synthesis connecting search, epistemic artefact production, recognition, validation, assimilation and realization to expansion of reachable worthwhile possibilities.';
          metaDirection.direction = 'Test whether cognitive and autonomous search machinery can safely displace the constraints that currently limit worthwhile frontier expansion.';
          for (const id of ['direction:epistemic-artefacts-assimilation', 'direction:constitutional-attention-search']) {
            if (!metaDirection.related.includes(id)) metaDirection.related.push(id);
          }

          const discoveryDirection = knowledgeById('direction:distributed-discovery');
          if (!discoveryDirection) throw new Error('missing distributed-discovery direction');
          discoveryDirection.direction = 'Use the 7 September 2026 epistemic-artefacts/constitutional-attention session as the first end-to-end standards-first discovery episode, then identify genuine provenance gaps.';
          if (!discoveryDirection.related.includes('direction:epistemic-artefacts-assimilation')) discoveryDirection.related.push('direction:epistemic-artefacts-assimilation');

          const newDirections = [
            {
              id: 'direction:epistemic-artefacts-assimilation',
              title: 'Epistemic artefacts, assimilation and frontier formation',
              kind: 'possibility',
              layer: 'direction',
              commitment: 'option',
              meaningful: false,
              topics: ['epistemic-artifacts', 'epistemic-opacity', 'assimilation', 'human-ai', 'knowledge'],
              status: 'Preserved option',
              summary: 'Separate discovery outputs, warrant, agent-relative understanding, assimilation, capability and frontier effects so uncomprehended machine outputs are not silently promoted to human knowledge.',
              direction: 'Deepen lineage and test the state model against real human-machine discovery episodes.',
              href: '/frontier/',
              related: ['direction:distributed-discovery', 'object:authorial-capacity', 'direction:human-scale-horizon']
            },
            {
              id: 'direction:constitutional-attention-search',
              title: 'Constitutional attention for continuous scarcity-displacement search',
              kind: 'possibility',
              layer: 'direction',
              commitment: 'option',
              meaningful: false,
              topics: ['attention', 'oversight', 'evolutionary-search', 'frontier-expansion', 'externalities'],
              status: 'Preserved option',
              summary: 'Move scarce human intervention from reviewing every candidate toward shaping worthwhile-future objectives, harm/externality constraints, escalation rules and constitutional updates for autonomous frontier search.',
              direction: 'Formalize and compare against established interactive evolutionary computation, selective oversight, safe exploration and multi-objective optimization.',
              href: '/frontier/',
              related: ['direction:effective-adjacent-possible', 'direction:expert-attention', 'direction:economics-epistemic-abundance']
            }
          ];

          const insertAt = knowledge.objects.findIndex((item) => item.id === 'direction:human-scale-horizon');
          for (const item of newDirections.reverse()) {
            if (!knowledgeById(item.id)) knowledge.objects.splice(insertAt < 0 ? knowledge.objects.length : insertAt, 0, item);
          }
          fs.writeFileSync(knowledgePath, JSON.stringify(knowledge, null, 2) + '\n');
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Validate JSON-LD and build site
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('docs/sessions/2026-09-07_EPISTEMIC_ARTEFACTS_AND_CONSTITUTIONAL_ATTENTION.prov.jsonld','utf8')); console.log('JSON-LD syntax OK')"
          npm run build
      - name: Remove one-shot workflow and commit capture
        run: |
          rm .github/workflows/capture-epistemic-session.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sessions src/data/possibilityPortfolio.json src/data/knowledgeIndex.json .github/workflows/capture-epistemic-session.yml
          git commit -m "Register epistemic artefact and constitutional attention possibilities"
          git push origin HEAD:research/epistemic-artefacts-constitutional-attention
