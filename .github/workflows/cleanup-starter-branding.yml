name: One-shot starter branding cleanup

on:
  push:
    branches:
      - cleanup/remove-starter-branding

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v7
        with:
          ref: cleanup/remove-starter-branding
      - name: Synchronize generated package metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('package-lock.json')
          text = path.read_text()
          stale = 'shaggy-singularity'
          replacement = 'agalmic-research'
          count = text.count(stale)
          if count != 2:
              raise SystemExit(f'expected exactly 2 stale lockfile references, found {count}')
          path.write_text(text.replace(stale, replacement))
          PY

          rm .github/workflows/cleanup-starter-branding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize lockfile branding"
          git push origin HEAD:cleanup/remove-starter-branding
